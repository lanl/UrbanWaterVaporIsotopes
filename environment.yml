name: urban-water-vapor-isotopes
channels:
  - conda-forge
dependencies:
  # Python and core scientific stack used in the validated analysis environment
  - python=3.8.19
  - numpy=1.24.3
  - pandas=1.5.3
  - scipy=1.10.1
  - matplotlib=3.5.3
  - xarray=2023.1.0
  - rioxarray=0.13.4
  - rasterio=1.3.11
  - cartopy=0.21.1
  - shapely=2.0.1
  - pyproj=3.3.1
  - netcdf4=1.6.2
  - scikit-learn=1.3.2
  - dask=2023.4.1

  # Notebook/runtime and small analysis dependencies
  - pyarrow
  - adjusttext
  - ipykernel
  - notebook
  - jupyterlab
